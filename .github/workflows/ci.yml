# Runs the checks on every push and pull request.
#
# The recordings and the trained model are personal and not in the repository, so the
# tests that need them (the Swift-vs-Python model comparison) skip themselves here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository: it needs no other right.
permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    steps:
      # Actions are pinned to a commit, not a tag: a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: swift build -c release

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Python environment
        # --locked: install exactly what uv.lock records, or fail.
        run: cd training && uv sync --locked

      - name: Lint
        run: make lint

      - name: Tests
        run: make test
